name: trigger-phrase-check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0 — pin full SHA (not floating tag)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check for Hermes scanner tripwire phrases
        run: bash scripts/check-trigger-phrases.sh
